# ---------- Шрифт ----------
font_family      JetBrainsMono Nerd Font
font_size        9.5

# ---------- Цвета ----------
background #1a2332
foreground #d8dee9

color0 #1a2332
color8 #4c5a6a
color1 #bf616a
color9 #bf616a
color2 #a3be8c
color10 #a3be8c
color3 #ebcb8b
color11 #ebcb8b
color4 #5294e2
color12 #5294e2
color5 #b48ead
color13 #b48ead
color6 #88c0d0
color14 #88c0d0
color7 #d8dee9
color15 #d8dee9

# ---------- Прозрачность ----------
# Включаем динамическую прозрачность
dynamic_background_opacity yes

# Устанавливаем прозрачность (0.0 - полная, 1.0 - непрозрачный)
background_opacity 0.85

# ---------- Курсор ----------
cursor_shape block
cursor_blink_interval 0
cursor_trail 100
cursor_trail_start_threshold 0
cursor_trail_decay 0.20 1.00
# ---------- Скролл ----------
scrollback_lines 10000

# ---------- Табы ----------
tab_bar_style powerline
active_tab_foreground   #1a2332
active_tab_background   #5294e2
inactive_tab_foreground #d8dee9
inactive_tab_background #2a3748
tab_separator " ▍"

# ---------- Звук ----------
enable_audio_bell no

# ---------- Горячие клавиши ----------
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard
map ctrl+shift+equal increase_font_size
map ctrl+shift+minus decrease_font_size
map ctrl+shift+backspace restore_font_size

# ---------- Шелл ----------
shell /usr/bin/fish
